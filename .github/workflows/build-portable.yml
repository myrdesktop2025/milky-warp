name: Build Portable EXE (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Remove broken lockfile and set config
        run: |
          rm -f pnpm-lock.yaml
          pnpm config set ignore-scripts false
        shell: bash

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile   # 重新生成锁文件

      - name: Build portable EXE
        run: pnpm run tauri build -- --no-bundle --target x86_64-pc-windows-msvc

      - name: Upload portable files
        uses: actions/upload-artifact@v4
        with:
          name: milky-warp-portable
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/milky-warp.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/resources/
            src-tauri/target/x86_64-pc-windows-msvc/release/*.dll