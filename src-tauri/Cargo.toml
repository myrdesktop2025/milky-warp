[package]
name = "milky-warp"
version = "1.0.0"
description = "Milky Warp"
authors = ["hugoattal"]
license = "MIT"
repository = "https://github.com/hugoattal/milky-warp"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.3", features = [] }

[patch.crates-io]
tao = { git = "https://github.com/tauri-apps/tao", branch = "v0.16" }

[dependencies]
tauri = { version = "1.3", features = [
    "global-shortcut-all",
    "protocol-asset",
    "shell-open",
    "system-tray",
    "window-hide",
    "window-set-ignore-cursor-events",
    "window-set-position",
    "window-set-size",
    "window-show",
    "process-relaunch",
    "process-exit"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
enigo = "0.1.2"
screenshots = "0.5.4"
winapi = { version = "0.3.9", features = ["winuser"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
